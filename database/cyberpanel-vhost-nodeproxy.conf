# CyberPanel → rakushopbd.com → vHost Conf
# Add this block (extprocessor + context). Remove duplicate rewrite [P] if present.

extprocessor rakushopbd_node {
  type                    proxy
  address                 127.0.0.1:3001
  maxConns                100
  pcKeepAliveTimeout      60
  initTimeout             60
  retryTimeout            0
  respBuffer              0
}

context / {
  type                    proxy
  handler                 rakushopbd_node
  addDefaultCharset       off
}
